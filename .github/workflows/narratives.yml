name: Refresh narratives

on:
  schedule:
    # 11:47 UTC = 6:47 AM Central, between hourly shifts
    - cron: "47 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python update_narratives.py
      - name: Save to the repo
        run: |
          git config user.name "pumpbot"
          git config user.email "pumpbot@users.noreply.github.com"
          git add narratives.txt
          git diff --cached --quiet && exit 0
          git commit -m "Refresh trending narratives $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
