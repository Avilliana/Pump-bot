<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pump Bot">
<title>Pump Bot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322c55e'/%3E%3Cpath d='M7 21l6-6 4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#111418; --muted:#5f6b7a; --line:#e3e7ec;
  --up:#15803d; --down:#c2410c; --accent:#2563eb; --bar:#cbd5e1; --warn-bg:#fff7e6; --warn:#92400e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --card:#161b22; --ink:#e8edf3; --muted:#8b98a8; --line:#262d36;
    --up:#34d399; --down:#fb923c; --accent:#60a5fa; --bar:#334155; --warn-bg:#2a2210; --warn:#fbbf24;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --card:#161b22; --ink:#e8edf3; --muted:#8b98a8; --line:#262d36;
  --up:#34d399; --down:#fb923c; --accent:#60a5fa; --bar:#334155; --warn-bg:#2a2210; --warn:#fbbf24;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:17px;margin:0;display:flex;align-items:center;gap:8px}
.badge{font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.updated{font-size:12px;color:var(--muted);text-align:right}
button.refresh{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.hero .label{font-size:12px;color:var(--muted)}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.hero .chg{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
#chart{width:100%;height:120px;display:block;margin-top:10px}
.chart-note{font-size:12px;color:var(--muted);margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .label{font-size:12px;color:var(--muted)}
.stat .val{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .sub{font-size:12px;color:var(--muted)}
h2{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.trade{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.trade:first-of-type{border-top:0}
.trade a{color:var(--ink);text-decoration:none;font-weight:600}
.trade .meta{font-size:12px;color:var(--muted)}
.trade .pnl{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.rej{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:4px 10px;align-items:center;font-size:13px}
.rej .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);margin-bottom:6px;overflow:hidden}
.rej .fill{height:100%;background:var(--bar);border-radius:3px}
.rej .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:13px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;display:none}
footer{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Pump Bot <span class="badge">PAPER</span></h1>
    <div class="updated"><span id="updated">Loading…</span><br><button class="refresh" id="refresh">Refresh</button></div>
  </header>

  <div class="warn" id="warn"></div>

  <section class="card hero">
    <div class="label">Paper account</div>
    <div class="big" id="equity">—</div>
    <div class="chg" id="change">&nbsp;</div>
    <svg id="chart" viewBox="0 0 300 120" preserveAspectRatio="none" aria-label="Equity over time"></svg>
    <div class="chart-note" id="chartnote"></div>
  </section>

  <section class="grid">
    <div class="card stat"><div class="label">Win rate</div><div class="val" id="winrate">—</div><div class="sub" id="wins"></div></div>
    <div class="card stat"><div class="label">Closed trades</div><div class="val" id="closed">—</div><div class="sub" id="bought"></div></div>
    <div class="card stat"><div class="label">Best trade</div><div class="val" id="best">—</div></div>
    <div class="card stat"><div class="label">Worst trade</div><div class="val" id="worst">—</div></div>
  </section>

  <section class="card">
    <h2>Recent trades</h2>
    <div id="trades"><div class="empty">No trades yet.</div></div>
  </section>

  <section class="card">
    <h2>Why tokens got skipped</h2>
    <div id="rejects" class="rej"></div>
    <div class="chart-note" id="scanned"></div>
  </section>

  <footer>Paper money only · the bot runs 20 min every hour · page refreshes itself</footer>
</main>

<script>
const REPO_RAW = "https://raw.githubusercontent.com/Avilliana/Pump-bot/main/";
const $ = id => document.getElementById(id);

async function getText(path){
  const bust = "?t=" + Date.now();
  for (const base of ["", REPO_RAW]) {
    try {
      const r = await fetch(base + path + bust, {cache: "no-store"});
      if (r.ok) return await r.text();
    } catch (e) {}
  }
  return null;
}

function parseCSV(text){
  if (!text) return [];
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  const head = rows.shift() || [];
  return rows.filter(r => r.length === head.length)
             .map(r => Object.fromEntries(head.map((h, i) => [h, r[i]])));
}

const utc = s => new Date(s.replace(" ", "T") + "Z");
const money = v => "$" + Number(v).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = v => (v > 0 ? "+" : "") + Number(v).toFixed(1) + "%";
const cls = v => v > 0 ? "up" : v < 0 ? "down" : "flat";
const central = d => d.toLocaleString("en-US", {timeZone: "America/Chicago", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});

function ago(d){
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  return h < 48 ? h + " hr ago" : Math.round(h / 24) + " days ago";
}

function drawChart(points, startUsd, perTrade){
  const svg = $("chart");
  svg.innerHTML = "";
  if (points.length < 2) {
    svg.style.display = "none";
    $("chartnote").textContent = "The chart fills in after a few shifts.";
    return;
  }
  svg.style.display = "block";
  $("chartnote").textContent = (perTrade ? "Balance after each closed trade" : "Equity after each shift") +
    " · dashed line = starting $" + startUsd.toFixed(0);
  const W = 300, H = 120, P = 6;
  const ys = points.map(p => p.y).concat([startUsd]);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 1) { hi += 0.5; lo -= 0.5; }
  const t0 = points[0].t, t1 = points[points.length - 1].t || t0 + 1;
  const X = t => P + (W - 2*P) * ((t - t0) / Math.max(1, t1 - t0));
  const Y = v => H - P - (H - 2*P) * ((v - lo) / (hi - lo));
  const ns = "http://www.w3.org/2000/svg";
  const base = document.createElementNS(ns, "line");
  base.setAttribute("x1", 0); base.setAttribute("x2", W);
  base.setAttribute("y1", Y(startUsd)); base.setAttribute("y2", Y(startUsd));
  base.setAttribute("stroke", "var(--line)"); base.setAttribute("stroke-dasharray", "4 4");
  base.setAttribute("vector-effect", "non-scaling-stroke");
  svg.appendChild(base);
  const last = points[points.length - 1].y;
  const path = document.createElementNS(ns, "path");
  path.setAttribute("d", points.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" "));
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", last >= startUsd ? "var(--up)" : "var(--down)");
  path.setAttribute("stroke-width", "2.5");
  path.setAttribute("stroke-linejoin", "round");
  path.setAttribute("vector-effect", "non-scaling-stroke");
  svg.appendChild(path);
}

async function load(){
  $("updated").textContent = "Loading…";
  const [sumText, tradesText, eqText] = await Promise.all([
    getText("logs/summary.json"), getText("logs/trades.csv"), getText("logs/equity.csv")]);
  let s;
  try { s = JSON.parse(sumText); } catch (e) { s = null; }
  if (!s) {
    $("updated").textContent = "Couldn't load data";
    $("warn").style.display = "block";
    $("warn").textContent = "No data yet, or GitHub is slow. Try Refresh in a minute.";
    return;
  }

  const startUsd = s.start_balance_sol * s.sol_usd;
  const updated = utc(s.updated);
  $("updated").textContent = "Updated " + ago(updated);
  const staleMin = (Date.now() - updated) / 60000;
  if (staleMin > 150) {
    $("warn").style.display = "block";
    $("warn").textContent = "No new shift for " + ago(updated).replace(" ago", "") +
      ". GitHub may be delaying runs; the health check will flag it if something broke.";
  } else $("warn").style.display = "none";

  $("equity").textContent = money(s.equity_usd);
  const ch = $("change");
  const diff = s.equity_usd - 50;
  ch.className = "chg " + cls(s.return_pct);
  ch.textContent = (diff >= 0 ? "+" : "−") + money(Math.abs(diff)).slice(0) + "  (" + pct(s.return_pct) + ") since start";

  $("winrate").textContent = s.closed_trades ? Math.round(s.win_rate_pct) + "%" : "—";
  $("wins").textContent = s.closed_trades ? s.wins + " of " + s.closed_trades + " won" : "no closed trades";
  $("closed").textContent = s.closed_trades;
  $("bought").textContent = s.bought + " bought total";
  for (const [id, v] of [["best", s.best_trade_pct], ["worst", s.worst_trade_pct]]) {
    const el = $(id);
    el.textContent = v === null || v === undefined ? "—" : pct(v);
    el.className = "val " + (v === null || v === undefined ? "" : cls(v));
  }

  // chart: equity per shift, falling back to balance after each closed trade
  const eq = parseCSV(eqText);
  let pts = eq.map(r => ({t: utc(r.time).getTime(), y: +r.equity_usd}));
  const trades = parseCSV(tradesText);
  const perTrade = pts.length < 2;
  if (perTrade) {
    pts = [{t: 0, y: startUsd}].concat(trades.filter(r => r.action === "SELL")
      .map((r, i) => ({t: i + 1, y: +r.balance_sol * s.sol_usd})));
  }
  drawChart(pts, startUsd, perTrade);

  // recent trades (closed)
  const closed = trades.filter(r => r.action === "SELL").slice(-10).reverse();
  const box = $("trades");
  box.innerHTML = "";
  if (!closed.length) box.innerHTML = '<div class="empty">No closed trades yet.</div>';
  for (const r of closed) {
    const row = document.createElement("div"); row.className = "trade";
    const left = document.createElement("div");
    const a = document.createElement("a");
    a.href = "https://pump.fun/coin/" + r.mint; a.target = "_blank"; a.rel = "noopener";
    a.textContent = r.symbol || "?";
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = r.reason + " · " + central(utc(r.time));
    left.append(a, meta);
    const p = document.createElement("div");
    const v = parseFloat(r.pnl_pct);
    p.className = "pnl " + cls(v); p.textContent = isNaN(v) ? "—" : pct(v);
    row.append(left, p); box.appendChild(row);
  }

  // rejection reasons
  const rej = Object.entries(s.reject_reasons || {});
  const rb = $("rejects"); rb.innerHTML = "";
  const names = {dev: "Dev held too much / sold", "no traction": "No real buyers", bundled: "Bundled launch",
                 top10: "Top wallets own too much", "mcap too high (late)": "Already pumped (late)",
                 "on-chain": "On-chain holders too concentrated", "no socials": "No socials"};
  const max = Math.max(1, ...rej.map(([, n]) => n));
  if (!rej.length) rb.innerHTML = '<div class="empty">Nothing yet.</div>';
  for (const [k, n] of rej.slice(0, 6)) {
    const lab = document.createElement("div"); lab.textContent = names[k] || k;
    const num = document.createElement("div"); num.className = "n"; num.textContent = n;
    const tr = document.createElement("div"); tr.className = "track";
    const f = document.createElement("div"); f.className = "fill"; f.style.width = (n / max * 100) + "%";
    tr.appendChild(f); rb.append(lab, num, tr);
  }
  $("scanned").textContent = s.tokens_seen.toLocaleString() + " launches scanned · " +
    s.bought + " passed every filter";
}

$("refresh").addEventListener("click", load);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(load, 5 * 60 * 1000);
load();
</script>
</body>
</html>
